<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular Path for SAPHAL SURGICAL -->
    <path id="textPathTop" d="M 90,250 A 160,160 0 1,1 410,250" fill="none" />
    <!-- Circular Path for CHITWAN, NEPAL -->
    <path id="textPathBottom" d="M 410,250 A 160,160 0 0,1 90,250" fill="none" />
  </defs>

  <g fill="none" stroke="#1b5e20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Double Border -->
    <circle cx="250" cy="250" r="230" stroke-width="10" />
    <circle cx="250" cy="250" r="212" stroke-width="4" />

    <!-- Inner Circle -->
    <circle cx="250" cy="250" r="140" stroke-width="6" />

    <!-- Dividing Cross Lines -->
    <line x1="250" y1="110" x2="250" y2="390" stroke-width="6" />
    <line x1="110" y1="250" x2="390" y2="250" stroke-width="6" />

    <!-- Center Hub -->
    <circle cx="250" cy="250" r="18" fill="#1b5e20" />

    <!-- Top Left: Surgical Tweezers / Forceps -->
    <path d="M 175,215 L 210,145 C 213,138 222,143 218,150 L 195,215 Z" stroke-width="4" fill="#1b5e20" fill-opacity="0.15" />
    <line x1="190" y1="180" x2="202" y2="185" stroke-width="3" />
    <line x1="186" y1="190" x2="197" y2="194" stroke-width="3" />

    <!-- Top Right: Surgical Scissors -->
    <g stroke-width="4">
      <circle cx="280" cy="205" r="9" />
      <circle cx="305" cy="200" r="9" />
      <path d="M 284,197 L 318,142" />
      <path d="M 302,192 L 292,142" />
      <circle cx="297" cy="172" r="3" fill="#1b5e20" />
    </g>

    <!-- Bottom Left: Syringe -->
    <g stroke-width="4">
      <rect x="155" y="295" width="45" height="20" rx="3" transform="rotate(-40 177 305)" fill="#1b5e20" fill-opacity="0.15" />
      <line x1="145" y1="332" x2="135" y2="344" stroke-width="5" />
      <line x1="125" y1="356" x2="142" y2="336" stroke-width="4" />
      <line x1="198" y1="270" x2="216" y2="248" stroke-width="3" />
      <line x1="172" y1="300" x2="178" y2="295" stroke-width="2" />
      <line x1="179" y1="308" x2="185" y2="303" stroke-width="2" />
    </g>

    <!-- Bottom Right: Stethoscope -->
    <g stroke-width="4">
      <path d="M 280,265 C 280,310 325,310 325,270" />
      <path d="M 302,305 L 302,325 C 302,345 340,345 340,315" />
      <circle cx="340" cy="312" r="9" fill="#1b5e20" />
      <circle cx="280" cy="265" r="3" fill="#1b5e20" />
      <circle cx="325" cy="270" r="3" fill="#1b5e20" />
    </g>
  </g>

  <!-- Typography: SAPHAL SURGICAL -->
  <text fill="#1b5e20" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SAPHAL SURGICAL
    </textPath>
  </text>

  <!-- Star Emblems -->
  <g fill="#1b5e20">
    <!-- Left Star -->
    <polygon points="120,250 126,242 136,244 132,253 138,260 128,260 124,268 120,260 110,260 116,253 112,244 122,242" transform="scale(0.8) translate(30, 60)" />
    <!-- Right Star -->
    <polygon points="380,250 386,242 396,244 392,253 398,260 388,260 384,268 380,260 370,260 376,253 372,244 382,242" transform="scale(0.8) translate(85, 60)" />
  </g>

  <!-- Typography: CHITWAN, NEPAL -->
  <text fill="#1b5e20" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" letter-spacing="5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      CHITWAN, NEPAL
    </textPath>
  </text>
</svg>
